<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Galaxy Defender</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

:root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
}

body {
    background: radial-gradient(circle at 50% 0%, #182c5c, #050817 55%, #02030a);
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
}

#game {
    position: relative;
    width: min(100vw, 600px);
    height: 100%;
    max-height: 900px;
    margin: auto;
    overflow: hidden;
    background:
        radial-gradient(circle at 20% 20%, rgba(80,140,255,.15), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(160,50,255,.12), transparent 30%),
        #030616;
    border-left: 2px solid #238cff;
    border-right: 2px solid #238cff;
}

.star {
    position: absolute;
    width: 2px; height: 2px;
    background: white;
    border-radius: 50%;
}

#hud {
    position: absolute;
    top: 15px; left: 15px; right: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
}

.hudBox {
    padding: 10px 16px;
    border: 1px solid #168cff;
    border-radius: 12px;
    background: rgba(5,15,40,.75);
    backdrop-filter: blur(8px);
    box-shadow: 0 0 15px rgba(0,140,255,.3);
    font-size: 14px;
}
.hudValue { font-size: 22px; font-weight: bold; color: #49c8ff; }
#lives { color: #ff4d6d; }

/* ---------- Player ship ---------- */

#player {
    position: absolute;
    width: 54px; height: 70px;
    bottom: 50px;
    left: calc(50% - 27px);
    z-index: 10;
    transition: left .05s linear;
    filter: drop-shadow(0 0 8px rgba(40,190,255,.55));
}
#player svg { display: block; overflow: visible; }

.flame {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: flicker .12s infinite alternate;
}
.flameSmall { animation-duration: .09s; }
@keyframes flicker {
    from { transform: scaleY(.7);  opacity: .85; }
    to   { transform: scaleY(1.25); opacity: 1; }
}

/* ---------- Bullet ---------- */

.bullet {
    position: absolute;
    width: 5px; height: 22px;
    background: linear-gradient(#ffffff, #5ffcff 40%, #0aa5ff);
    border-radius: 10px;
    box-shadow: 0 0 8px #00eaff, 0 0 18px #00aaff;
    z-index: 5;
}

/* ---------- Enemies ---------- */

.enemy {
    position: absolute;
    width: 45px; height: 45px;
    z-index: 4;
}
.enemy svg { display: block; overflow: visible; }
.enemy.red    { filter: drop-shadow(0 0 7px rgba(255,40,70,.75)); }
.enemy.violet { filter: drop-shadow(0 0 7px rgba(190,70,255,.75)); }
.enemy.amber  { filter: drop-shadow(0 0 7px rgba(255,150,30,.75)); }

.eye { animation: pulse .9s ease-in-out infinite alternate; }
@keyframes pulse {
    from { opacity: .55; }
    to   { opacity: 1; }
}
.eFlame {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: eflicker .1s infinite alternate;
}
@keyframes eflicker {
    from { transform: scaleY(.6); }
    to   { transform: scaleY(1.2); }
}

/* ---------- Explosion ---------- */

.explosion {
    position: absolute;
    width: 45px; height: 45px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #ffd45a 30%, #ff6a1a 60%, rgba(255,40,0,0) 72%);
    box-shadow: 0 0 20px #ff6600, 0 0 40px #ff2200;
    animation: explode .35s forwards;
    z-index: 6;
    pointer-events: none;
}
@keyframes explode {
    0%   { transform: scale(.2); opacity: 1; }
    100% { transform: scale(2.2); opacity: 0; }
}

#instruction {
    position: absolute;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    padding: 8px 20px;
    border: 1px solid rgba(50,190,255,.5);
    border-radius: 20px;
    background: rgba(0,10,30,.7);
    color: #8eeaff;
    font-size: 13px;
    pointer-events: none;
    transition: opacity 1s;
}

#gameOver {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,10,.88);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}
#gameOver h1 { font-size: 48px; color: #ff405c; text-shadow: 0 0 15px #ff1744; }
.finalScore { margin-top: 15px; font-size: 22px; color: #67ddff; }
.restart {
    margin-top: 25px;
    padding: 12px 28px;
    border: 1px solid #27c9ff;
    border-radius: 25px;
    background: #06284b;
    color: white;
    font-size: 17px;
    cursor: pointer;
}
.restart:hover { background: #0a477d; }

@media (prefers-reduced-motion: reduce) {
    .eye, .flame, .eFlame { animation: none; }
}
</style>
</head>
<body>

<!-- Shared gradients for every ship -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gHull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b5fb8"/>
      <stop offset=".45" stop-color="#e9fbff"/>
      <stop offset=".55" stop-color="#e9fbff"/>
      <stop offset="1" stop-color="#1b5fb8"/>
    </linearGradient>
    <linearGradient id="gWingL" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ad4ff"/>
      <stop offset="1" stop-color="#0a2f7a"/>
    </linearGradient>
    <linearGradient id="gWingR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ad4ff"/>
      <stop offset="1" stop-color="#0a2f7a"/>
    </linearGradient>
    <radialGradient id="gCanopy" cx=".5" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#56e0ff"/>
      <stop offset="1" stop-color="#0a3d8f"/>
    </radialGradient>
    <linearGradient id="gFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#5ffcff"/>
      <stop offset="1" stop-color="#0066ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a0014"/>
      <stop offset=".6" stop-color="#e01f40"/>
      <stop offset="1" stop-color="#ff8a8a"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a5e"/>
      <stop offset=".6" stop-color="#8a3df0"/>
      <stop offset="1" stop-color="#e0b0ff"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2200"/>
      <stop offset=".6" stop-color="#f07a12"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="gEFlame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff3b00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gEye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#ffe24a"/>
      <stop offset="1" stop-color="#ff5a00"/>
    </radialGradient>
  </defs>
</svg>

<div id="game">

    <div id="hud">
        <div class="hudBox">SCORE<div class="hudValue" id="score">0</div></div>
        <div class="hudBox">LIVES<div class="hudValue" id="lives">❤️ ❤️ ❤️</div></div>
    </div>

    <div id="player">
        <svg viewBox="0 0 54 70" width="54" height="70">
            <!-- engine flames -->
            <path class="flame" d="M23.5 54 L27 70 L30.5 54Z" fill="url(#gFlame)"/>
            <path class="flame flameSmall" d="M9 56 L11 68 L13 56Z" fill="url(#gFlame)"/>
            <path class="flame flameSmall" d="M41 56 L43 68 L45 56Z" fill="url(#gFlame)"/>

            <!-- rear stabilizer fins -->
            <path d="M22 46 L15 58 L23 56Z" fill="#0d3d8c" stroke="#63dcff" stroke-width=".6"/>
            <path d="M32 46 L39 58 L31 56Z" fill="#0d3d8c" stroke="#63dcff" stroke-width=".6"/>

            <!-- swept wings -->
            <path d="M22 22 L3 46 L1 58 L14 55 L22 47Z" fill="url(#gWingL)" stroke="#8fe8ff" stroke-width=".8" stroke-linejoin="round"/>
            <path d="M32 22 L51 46 L53 58 L40 55 L32 47Z" fill="url(#gWingR)" stroke="#8fe8ff" stroke-width=".8" stroke-linejoin="round"/>

            <!-- wing panel lines -->
            <path d="M20 32 L8 49 M34 32 L46 49" stroke="#bff3ff" stroke-width=".6" opacity=".7"/>

            <!-- wingtip cannons -->
            <rect x="0.5" y="40" width="3" height="16" rx="1.5" fill="#dff8ff" stroke="#4fd0ff" stroke-width=".6"/>
            <rect x="50.5" y="40" width="3" height="16" rx="1.5" fill="#dff8ff" stroke="#4fd0ff" stroke-width=".6"/>
            <circle cx="2" cy="40" r="1.4" fill="#ff5a5a"/>
            <circle cx="52" cy="40" r="1.4" fill="#ff5a5a"/>

            <!-- fuselage -->
            <path d="M27 0 L31.5 14 L34 34 L33 52 L30 57 L24 57 L21 52 L20 34 L22.5 14Z"
                  fill="url(#gHull)" stroke="#aeeeff" stroke-width=".8" stroke-linejoin="round"/>
            <!-- center spine + intakes -->
            <path d="M27 30 L27 55" stroke="#2a7cd6" stroke-width="1"/>
            <path d="M22 40 L24.5 44 L22 48Z M32 40 L29.5 44 L32 48Z" fill="#0b3a86"/>

            <!-- cockpit -->
            <path d="M27 9 C30.5 13 31 20 30 26 L24 26 C23 20 23.5 13 27 9Z" fill="url(#gCanopy)" stroke="#ffffff" stroke-width=".6"/>
            <path d="M25.5 14 C26 17 26 21 25.8 24" stroke="#ffffff" stroke-width=".8" opacity=".8" fill="none"/>

            <!-- engine nozzle -->
            <rect x="24" y="55" width="6" height="3" rx="1" fill="#0a2a5c"/>
        </svg>
    </div>

    <div id="instruction">☝ DRAG TO MOVE</div>

    <div id="gameOver">
        <h1>GAME OVER</h1>
        <div class="finalScore">Score: <span id="finalScore">0</span></div>
        <button class="restart" onclick="restartGame()">PLAY AGAIN</button>
    </div>

</div>

<script>
/* =========================
   ENEMY SHIP ARTWORK
   (three types, all 45x45, nose pointing down)
========================= */

const ENEMY_TYPES = [
    {
        cls: "red",
        speed: 0,
        svg: `
<svg viewBox="0 0 45 45" width="45" height="45">
  <path class="eFlame" d="M15 9 L17.5 -1 L20 9Z M25 9 L27.5 -1 L30 9Z" fill="url(#gEFlame)"/>
  <path d="M22.5 44 L31 26 L44 4 L41 24 L33 16 L28 10 L17 10 L12 16 L4 24 L1 4 L14 26Z"
        fill="url(#gRed)" stroke="#ffb0b8" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M22.5 40 L27 24 L22.5 12 L18 24Z" fill="#2a000a" stroke="#ff6b80" stroke-width=".6"/>
  <path d="M8 18 L14 28 M37 18 L31 28" stroke="#ffd0d6" stroke-width=".8" opacity=".7"/>
  <circle class="eye" cx="22.5" cy="24" r="4" fill="url(#gEye)"/>
  <circle cx="4" cy="8" r="1.4" fill="#ffe24a"/><circle cx="41" cy="8" r="1.4" fill="#ffe24a"/>
</svg>`
    },
    {
        cls: "violet",
        speed: 0.6,
        svg: `
<svg viewBox="0 0 45 45" width="45" height="45">
  <path class="eFlame" d="M20 8 L22.5 -2 L25 8Z" fill="url(#gEFlame)"/>
  <path d="M22.5 44 L36 22 L40 6 L30 13 L22.5 7 L15 13 L5 6 L9 22Z"
        fill="url(#gViolet)" stroke="#e6c4ff" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M22.5 7 L30 13 L22.5 30 L15 13Z" fill="#1b0546" stroke="#c98bff" stroke-width=".6"/>
  <path d="M9 22 L15 13 M36 22 L30 13" stroke="#f1dcff" stroke-width=".7" opacity=".7"/>
  <ellipse class="eye" cx="22.5" cy="19" rx="3" ry="5" fill="url(#gEye)"/>
  <path d="M5 6 L2 10 M40 6 L43 10" stroke="#e6c4ff" stroke-width="1.4" stroke-linecap="round"/>
</svg>`
    },
    {
        cls: "amber",
        speed: -0.5,
        svg: `
<svg viewBox="0 0 45 45" width="45" height="45">
  <path class="eFlame" d="M10 8 L12.5 -1 L15 8Z M30 8 L32.5 -1 L35 8Z" fill="url(#gEFlame)"/>
  <path d="M22.5 42 L38 34 L44 18 L36 8 L9 8 L1 18 L7 34Z"
        fill="url(#gAmber)" stroke="#ffe0a8" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M12 12 L33 12 L37 20 L22.5 36 L8 20Z" fill="#2c1000" stroke="#ffb45a" stroke-width=".6"/>
  <rect x="9" y="30" width="4" height="10" rx="1.5" fill="#ffe0a8" stroke="#a04a00" stroke-width=".5"/>
  <rect x="32" y="30" width="4" height="10" rx="1.5" fill="#ffe0a8" stroke="#a04a00" stroke-width=".5"/>
  <circle class="eye" cx="22.5" cy="22" r="5" fill="url(#gEye)"/>
  <path d="M15 16 L19 19 M30 16 L26 19" stroke="#ffb45a" stroke-width=".8"/>
</svg>`
    }
];

/* =========================
   GAME VARIABLES
========================= */

const game = document.getElementById("game");
const player = document.getElementById("player");

let playerX = game.clientWidth / 2 - 27;
let score = 0;
let lives = 3;
let bullets = [];
let enemies = [];
let running = true;
let dragging = false;
let difficulty = 1;

/* =========================
   CREATE STARS
========================= */

for (let i = 0; i < 80; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.opacity = Math.random();
    game.appendChild(star);
}

/* =========================
   MOVE PLAYER
========================= */

function movePlayer(clientX) {
    const rect = game.getBoundingClientRect();
    let x = clientX - rect.left - 27;
    if (x < 5) x = 5;
    if (x > game.clientWidth - 59) x = game.clientWidth - 59;
    playerX = x;
    player.style.left = playerX + "px";
}

/* =========================
   TOUCH / MOUSE CONTROL
========================= */

game.addEventListener("touchstart", function(e) {
    dragging = true;
    movePlayer(e.touches[0].clientX);
}, { passive: false });

game.addEventListener("touchmove", function(e) {
    e.preventDefault();
    if (dragging) movePlayer(e.touches[0].clientX);
}, { passive: false });

game.addEventListener("touchend", function() { dragging = false; });

game.addEventListener("mousedown", function(e) {
    dragging = true;
    movePlayer(e.clientX);
});
game.addEventListener("mousemove", function(e) {
    if (dragging) movePlayer(e.clientX);
});
game.addEventListener("mouseup", function() { dragging = false; });

/* =========================
   SHOOT
========================= */

function shoot() {
    if (!running) return;

    const bullet = document.createElement("div");
    bullet.className = "bullet";

    const x = playerX + 24;
    const y = game.clientHeight - 120;

    bullet.style.left = x + "px";
    bullet.style.top = y + "px";
    game.appendChild(bullet);

    bullets.push({ element: bullet, x: x, y: y });
}

/* =========================
   CREATE ENEMY
========================= */

function createEnemy() {
    if (!running) return;

    const type = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];

    const enemy = document.createElement("div");
    enemy.className = "enemy " + type.cls;
    enemy.innerHTML = type.svg;

    const x = Math.random() * (game.clientWidth - 50);
    enemy.style.left = x + "px";
    enemy.style.top = "-50px";
    game.appendChild(enemy);

    enemies.push({ element: enemy, x: x, y: -50, speedMod: type.speed });
}

/* =========================
   COLLISION
========================= */

function collision(a, b) {
    const A = a.getBoundingClientRect();
    const B = b.getBoundingClientRect();
    return !(A.right < B.left || A.left > B.right || A.bottom < B.top || A.top > B.bottom);
}

/* =========================
   EXPLOSION
========================= */

function explosion(x, y) {
    const boom = document.createElement("div");
    boom.className = "explosion";
    boom.style.left = x + "px";
    boom.style.top = y + "px";
    game.appendChild(boom);
    setTimeout(() => boom.remove(), 350);
}

/* =========================
   UPDATE LIVES
========================= */

function updateLives() {
    let hearts = "";
    for (let i = 0; i < 3; i++) {
        hearts += i < lives ? "❤️ " : "🖤 ";
    }
    document.getElementById("lives").textContent = hearts;
}

/* =========================
   GAME LOOP
========================= */

function gameLoop() {
    if (!running) return;

    /* Move bullets */
    for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];

        bullet.y -= 10;
        bullet.element.style.top = bullet.y + "px";

        if (bullet.y < -30) {
            bullet.element.remove();
            bullets.splice(i, 1);
            continue;
        }

        /* Bullet vs enemy */
        for (let j = enemies.length - 1; j >= 0; j--) {
            const enemy = enemies[j];

            if (collision(bullet.element, enemy.element)) {
                explosion(enemy.x, enemy.y);
                bullet.element.remove();
                enemy.element.remove();
                bullets.splice(i, 1);
                enemies.splice(j, 1);

                score += 10;
                document.getElementById("score").textContent = score;
                break;
            }
        }
    }

    /* Move enemies */
    for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];

        enemy.y += 2.2 + difficulty + enemy.speedMod;
        enemy.element.style.top = enemy.y + "px";

        if (enemy.y > game.clientHeight - 100) {
            enemy.element.remove();
            enemies.splice(i, 1);

            lives--;
            updateLives();

            if (lives <= 0) endGame();
        }
    }

    requestAnimationFrame(gameLoop);
}

/* =========================
   TIMERS
========================= */

setInterval(function() { if (running) shoot(); }, 350);
setInterval(function() { if (running) createEnemy(); }, 850);
setInterval(function() { if (running) difficulty += 0.15; }, 5000);

/* =========================
   GAME OVER / RESTART
========================= */

function endGame() {
    running = false;
    document.getElementById("finalScore").textContent = score;
    document.getElementById("gameOver").style.display = "flex";
}

function restartGame() {
    location.reload();
}

/* =========================
   HIDE INSTRUCTION
========================= */

setTimeout(function() {
    document.getElementById("instruction").style.opacity = "0";
}, 4000);

/* =========================
   START
========================= */

player.style.left = playerX + "px";
updateLives();
gameLoop();
</script>

</body>
</html>
